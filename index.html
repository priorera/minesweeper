<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Meta tags optimized for iPhone/Mobile: prevents zooming, fits to notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minesweeper</title>
    <style>
        /* Base mobile resets and safety padding */
        :root {
            --win-bg: #c0c0c0;
            --win-border-light: #ffffff;
            --win-border-dark: #808080;
            --win-text: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b; /* Dark backdrop for modern phones */
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* UPDATED: Pushes the game board to the top rather than centering it vertically */
            justify-content: flex-start; 
            min-height: 100vh;
            
            /* UPDATED: Minimal padding at the top + safe area for the notch */
            padding-top: calc(env(safe-area-inset-top) + 15px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 15px);
            box-sizing: border-box;

            /* UPDATED: Allows scrolling (pan) but disables double-tap and pinch-to-zoom */
            touch-action: pan-x pan-y;
            
            font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Classic Windows 95 Outset Border */
        .win95-window {
            background-color: var(--win-bg);
            border-left: 3px solid var(--win-border-light);
            border-top: 3px solid var(--win-border-light);
            border-right: 3px solid var(--win-border-dark);
            border-bottom: 3px solid var(--win-border-dark);
            padding: 8px;
            display: inline-block;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* Classic Windows 95 Inset Border */
        .win95-inset {
            border-left: 3px solid var(--win-border-dark);
            border-top: 3px solid var(--win-border-dark);
            border-right: 3px solid var(--win-border-light);
            border-bottom: 3px solid var(--win-border-light);
            background-color: var(--win-bg);
        }

        /* Header containing counters and smiley */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            margin-bottom: 8px;
        }

        /* Digital counters (Mines and Timer) */
        .digital-counter {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: bold;
            padding: 2px 4px;
            line-height: 1;
            width: 54px;
            text-align: center;
            letter-spacing: 1px;
            border-left: 2px solid var(--win-border-dark);
            border-top: 2px solid var(--win-border-dark);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
        }

        /* Smiley Face Button */
        #smiley-btn {
            width: 42px;
            height: 42px;
            font-size: 24px;
            background-color: var(--win-bg);
            border-left: 3px solid var(--win-border-light);
            border-top: 3px solid var(--win-border-light);
            border-right: 3px solid var(--win-border-dark);
            border-bottom: 3px solid var(--win-border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
        }

        #smiley-btn:active {
            border-left: 3px solid var(--win-border-dark);
            border-top: 3px solid var(--win-border-dark);
            border-right: 3px solid var(--win-border-light);
            border-bottom: 3px solid var(--win-border-light);
        }

        /* The Grid */
        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            
            /* Prevents scrolling only when touching the actual grid */
            touch-action: none; 
        }

        /* Individual Cells */
        .cell {
            width: 36px;
            height: 36px;
            background-color: var(--win-bg);
            border-left: 3px solid var(--win-border-light);
            border-top: 3px solid var(--win-border-light);
            border-right: 3px solid var(--win-border-dark);
            border-bottom: 3px solid var(--win-border-dark);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            cursor: pointer;
        }

        .cell.revealed {
            border: 1px solid var(--win-border-dark);
            border-right-color: var(--win-bg);
            border-bottom-color: var(--win-bg);
        }

        .cell.mine-red {
            background-color: red;
            border: 1px solid var(--win-border-dark);
            border-right-color: var(--win-bg);
            border-bottom-color: var(--win-bg);
        }

        /* Classic Colors for Numbers */
        .n1 { color: #0000ff; }
        .n2 { color: #008000; }
        .n3 { color: #ff0000; }
        .n4 { color: #000080; }
        .n5 { color: #800000; }
        .n6 { color: #008080; }
        .n7 { color: #000000; }
        .n8 { color: #808080; }

        /* Mobile specific controls (since no right-click) */
        #mobile-controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        .mode-btn {
            background-color: var(--win-bg);
            border-left: 2px solid var(--win-border-light);
            border-top: 2px solid var(--win-border-light);
            border-right: 2px solid var(--win-border-dark);
            border-bottom: 2px solid var(--win-border-dark);
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            color: var(--win-text);
        }

        .mode-btn.active {
            border-left: 2px solid var(--win-border-dark);
            border-top: 2px solid var(--win-border-dark);
            border-right: 2px solid var(--win-border-light);
            border-bottom: 2px solid var(--win-border-light);
            background-color: #e0e0e0;
        }

        .instructions {
            color: #aaa;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            max-width: 300px;
            font-family: sans-serif;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="win95-window">
        <div id="header" class="win95-inset">
            <div id="mine-count" class="digital-counter">010</div>
            <button id="smiley-btn">🙂</button>
            <div id="timer" class="digital-counter">000</div>
        </div>
        <div id="board" class="win95-inset" oncontextmenu="return false;">
            <!-- Cells generated by JS -->
        </div>
    </div>

    <!-- Mobile Dig/Flag Toggle -->
    <div id="mobile-controls">
        <button id="btn-dig" class="mode-btn active">⛏️ Dig</button>
        <button id="btn-flag" class="mode-btn">🚩 Flag</button>
    </div>

    <div class="instructions">
        Tip: You can use the buttons above to switch modes, or <b>long-press</b> a square to place a flag!
    </div>

    <script>
        // --- Safari specific anti-zoom bulletproofing ---
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        }, { passive: false });
        // ------------------------------------------------

        const ROWS = 9;
        const COLS = 9;
        const TOTAL_MINES = 10;

        let board = [];
        let isFirstClick = true;
        let isGameOver = false;
        let minesLeft = TOTAL_MINES;
        let cellsRevealed = 0;
        let timerInterval = null;
        let timeElapsed = 0;
        let currentMode = 'dig'; // 'dig' or 'flag'
        let pressTimer = null; // for long press

        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const smileyBtn = document.getElementById('smiley-btn');
        const btnDig = document.getElementById('btn-dig');
        const btnFlag = document.getElementById('btn-flag');

        // Sounds/Haptics fallback
        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Setup Buttons
        btnDig.addEventListener('click', () => setMode('dig'));
        btnFlag.addEventListener('click', () => setMode('flag'));
        smileyBtn.addEventListener('click', initGame);

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'dig') {
                btnDig.classList.add('active');
                btnFlag.classList.remove('active');
            } else {
                btnFlag.classList.add('active');
                btnDig.classList.remove('active');
            }
        }

        function formatNumber(num) {
            if (num < 0) {
                return "-" + String(Math.abs(num)).padStart(2, '0');
            }
            return String(num).padStart(3, '0');
        }

        function updateMineCount() {
            mineCountEl.textContent = formatNumber(minesLeft);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeElapsed++;
                if (timeElapsed > 999) timeElapsed = 999;
                timerEl.textContent = formatNumber(timeElapsed);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function initGame() {
            stopTimer();
            isFirstClick = true;
            isGameOver = false;
            minesLeft = TOTAL_MINES;
            cellsRevealed = 0;
            timeElapsed = 0;
            updateMineCount();
            timerEl.textContent = "000";
            smileyBtn.textContent = '🙂';
            boardEl.innerHTML = '';
            board = [];

            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell');
                    cellEl.dataset.r = r;
                    cellEl.dataset.c = c;
                    
                    // Touch / Mouse Events
                    cellEl.addEventListener('pointerdown', handlePointerDown);
                    cellEl.addEventListener('pointerup', handlePointerUp);
                    cellEl.addEventListener('pointercancel', handlePointerCancel);
                    cellEl.addEventListener('pointerleave', handlePointerCancel);

                    boardEl.appendChild(cellEl);

                    row.push({
                        r, c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        el: cellEl
                    });
                }
                board.push(row);
            }
        }

        // Pointer event handlers for unified touch/mouse + long press logic
        function handlePointerDown(e) {
            if (isGameOver) return;
            if (e.button === 2) return; // ignore right click here, handled by contextmenu event below (fallback)
            
            const r = parseInt(e.target.dataset.r);
            const c = parseInt(e.target.dataset.c);
            const cell = board[r][c];

            if (!cell.isRevealed) {
                smileyBtn.textContent = '😮';
            }

            // Start long press timer
            pressTimer = setTimeout(() => {
                pressTimer = null;
                vibrate(); // Haptic feedback for flag placement
                toggleFlag(r, c);
            }, 400); // 400ms long press
        }

        function handlePointerUp(e) {
            if (isGameOver) return;
            smileyBtn.textContent = '🙂';
            
            const r = parseInt(e.target.dataset.r);
            const c = parseInt(e.target.dataset.c);
            
            // If timer still exists, it was a short press
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
                
                // Execute action based on current toggle mode
                if (currentMode === 'dig') {
                    dig(r, c);
                } else {
                    toggleFlag(r, c);
                }
            }
        }

        function handlePointerCancel() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (!isGameOver) smileyBtn.textContent = '🙂';
        }

        // Fallback for desktop right-click
        boardEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (isGameOver) return;
            const target = e.target.closest('.cell');
            if (target) {
                const r = parseInt(target.dataset.r);
                const c = parseInt(target.dataset.c);
                toggleFlag(r, c);
            }
        });

        function placeMines(safeR, safeC) {
            let placed = 0;
            while (placed < TOTAL_MINES) {
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                
                // Ensure 3x3 safe zone around first click
                if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
                
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    placed++;
                }
            }

            // Calculate neighbor counts
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c].isMine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function toggleFlag(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.el.textContent = '';
                minesLeft++;
            } else {
                cell.isFlagged = true;
                cell.el.textContent = '🚩';
                minesLeft--;
            }
            updateMineCount();
        }

        function dig(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            if (isFirstClick) {
                isFirstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (cell.isMine) {
                gameOver(false, r, c);
                return;
            }

            reveal(r, c);

            if (cellsRevealed === ROWS * COLS - TOTAL_MINES) {
                gameOver(true);
            }
        }

        function reveal(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.el.classList.add('revealed');
            cellsRevealed++;

            if (cell.neighborMines > 0) {
                cell.el.textContent = cell.neighborMines;
                cell.el.classList.add('n' + cell.neighborMines);
            } else {
                // Flood fill for 0 neighbor mines
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            reveal(nr, nc);
                        }
                    }
                }
            }
        }

        function gameOver(win, clickR = -1, clickC = -1) {
            isGameOver = true;
            stopTimer();

            if (win) {
                smileyBtn.textContent = '😎';
                minesLeft = 0;
                updateMineCount();
                // Flag all remaining mines
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = board[r][c];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.isFlagged = true;
                            cell.el.textContent = '🚩';
                        }
                    }
                }
            } else {
                smileyBtn.textContent = '😵';
                vibrate();
                
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = board[r][c];
                        if (cell.isMine) {
                            if (!cell.isFlagged) {
                                cell.el.textContent = '💣';
                                cell.el.classList.add('revealed');
                                if (r === clickR && c === clickC) {
                                    cell.el.classList.add('mine-red');
                                }
                            }
                        } else if (cell.isFlagged) {
                            // Incorrectly flagged
                            cell.el.textContent = '❌';
                            cell.el.classList.add('revealed');
                        }
                    }
                }
            }
        }

        // Initialize the game on load
        window.onload = initGame;
    </script>
</body>
</html>
